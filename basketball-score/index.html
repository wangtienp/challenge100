<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Score</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="scoreboard-container">
        <div class="section">
            <div class="team-container">
                <h1 class="team">HOME</h1>
                <h1 class="home scoreboard">0</h1>
                <div class="score-buttons">
                    <button disabled onclick="addHomeScore(1)">+1</button>
                    <button disabled onclick="addHomeScore(2)">+2</button>
                    <button disabled onclick="addHomeScore(3)">+3</button>
                </div>
            </div>
        </div>
        <div class="section control">
            <div class="timer">10:00</div>
            <div class="new-game">
                <button>New Game</button>
            </div>
        </div>
        <div class="section">
            <div class="team-container">
                <h1 class="team">GUEST</h1>
                <h1 class="guest scoreboard">0</h1>
                <div class="score-buttons">
                    <button disabled onclick="addGuessScore(1)">+1</button>
                    <button disabled onclick="addGuessScore(2)">+2</button>
                    <button disabled onclick="addGuessScore(3)">+3</button>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
