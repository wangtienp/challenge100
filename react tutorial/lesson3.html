        function App(){
            const [inputName,setInputName] = React.useState('')
            function setName(e){
                setInputName(e.target.value)
            }
            return (
                <>
                    <input placeholder="Type a name here" type ="text" onChange ={setName} value={inputName}/>
                    <button onClick ={()=>setInputName('')}>Reset</button>
                    <button onClick ={()=>setInputName('Alice')}>Example</button>
                    <p>Hello {inputName}</p>
                </>
            )
        }
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
