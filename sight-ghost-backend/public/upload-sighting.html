<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <div class="container">
        <nav>
            <div class="left">
                <a href="/index.html"><img src="/images/candle.png" alt="candle logo" class="logo"></a>
            </div>
            <div class="right">
                <a href="/index.html">Home</a>
                <a href="/sighting.html">Read</a>
                <a href="/upload-sighting.html">Upload</a>
            </div>
        </nav>
        <div class="title">
            <h3>FROM THE OTHER SIDE</h3>
            <h2>ADD SIGHTING</h2>
        </div>

        <form class="sight-form">
            <div class="input-control">
                <label for="title">Title:</label>
                <input type="text" id="title">
            </div>
            <div class="input-control">
                <label for="date-time">Time/Date:</label>
                <input type="datetime-local" id="date-time">
            </div>
            <div class="input-control">
                <label for="location">Location:</label>
                <input type="text" id="location">
            </div>
            <div class="input-control">
                <label for="details">Details:</label>
                <textarea name="details" id="details" placeholder="Type something here..."></textarea>
            </div>
            <div class="input-control">
                <button type="submit">SUBMIT</button>
            </div>
        </form>
        <div class="message inactive">halo</div>
    </div>
    <script src="/upload-sighting.js" type="module"></script>
</body>

</html>
